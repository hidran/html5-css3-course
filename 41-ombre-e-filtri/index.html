<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sentieri del lago</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Sentieri del lago</h1>
    <p class="note">Prossima uscita guidata: sabato alle 8, ritrovo davanti al
      rifugio.</p>
  </header>
  <main>
    <article class="card">
      <img src="images/forest.svg" alt="Abeti lungo un sentiero">
      <h2>Giro del bosco</h2>
      <p>Due ore, facile: adatto a tutti.</p>
    </article>
    <article class="card">
      <img src="images/shore.svg" alt="Una barca rossa sul lago">
      <h2>Riva del lago</h2>
      <p>Tre ore, tutto intorno all'acqua.</p>
    </article>
    <article class="card closed">
      <img src="images/peak.svg" alt="Una cima con la neve">
      <h2>Salita alla cima</h2>
      <p>Chiuso per neve fino a giugno.</p>
    </article>
  </main>
</body>
</html>
